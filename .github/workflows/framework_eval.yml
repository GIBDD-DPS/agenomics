name: Framework Evaluation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  evaluate:
    # Закреплённый образ, а не ubuntu-latest: смена образа GitHub
    # (ubuntu-latest переходит на 26 с 19.10.2026) не должна незаметно
    # менять условия эксперимента.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/framework_evaluation
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Из checkout, а не с PyPI: иначе примеры в репозитории прогоняются
      # против последней опубликованной версии, и любое новое поле
      # EvidenceStore (например, model_version в 0.7.11) роняет каждый
      # фреймворк с TypeError до публикации релиза.
      - name: Install agenomics from this checkout
        run: |
          python -m pip install --upgrade pip
          pip install ../..

      - name: Install framework libraries
        run: |
          pip install langchain langchain-groq
          pip install autogen
          pip install llama-index-core llama-index-llms-groq
          pip install langgraph
          pip install haystack-ai
          pip install "camel-ai[web_tools]"
          pip install griptape
          pip install agno groq
          pip install pydantic-ai
          pip install dspy
          pip install google-adk litellm
          pip install swarms
          pip install semantic-kernel
          pip install openai-agents
          pip install beeai-framework
          # v0.9.5: вместо выключенных atomic_agents, crewai, txtai.
          # Все фреймворки стоят в одном окружении, и новый пакет может
          # сломать соседей. strands-agents без ограничения поднимает
          # opentelemetry до 1.45, с которым не импортируются swarms и
          # google-adk (он требует <=1.42.1). autogen-agentchat не взят:
          # понижает protobuf до 5.29 и ломает AG2.
          pip install "strands-agents[litellm]" "opentelemetry-api<=1.42.1" "opentelemetry-sdk<=1.42.1"
          pip install deepagents
          pip install agent-framework-core agent-framework-openai
          pip install "mirascope[openai]"  # вместо smolagents (выключен): ставит один пакет, соседей не трогает
          pip install requests
        continue-on-error: true

      # restore и save разделены (а не один actions/cache): с v0.8.0
      # раннер завершается с кодом 1, если упал required-фреймворк, а
      # post-шаг actions/cache сохраняет кэш только при успешном job.
      # Без if: always() на save история прогонов терялась бы ровно в
      # тех запусках, где что-то сломалось.
      - name: Restore evidence database from previous run
        uses: actions/cache/restore@v6
        with:
          path: examples/framework_evaluation/frameworks_evidence.db
          key: frameworks-evidence-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frameworks-evidence-db-

      # [Unreleased] Какие модели ротации (conditions.MODELS) сейчас есть у
      # Groq: снятая модель видна здесь, а не пачкой infrastructure_error.
      # Без ответа /models (нет ключа, сбой) остаются все модели.
      - name: Check available Groq models
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os, sys, urllib.request
          from conditions import JUDGE_MODELS, MODELS
          wanted = list(dict.fromkeys(MODELS + JUDGE_MODELS))
          from judge import USER_AGENT
          req = urllib.request.Request("https://api.groq.com/openai/v1/models",
                                       headers={"Authorization": f"Bearer {os.environ.get('GROQ_API_KEY', '')}",
                                                "User-Agent": USER_AGENT})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  have = {m["id"] for m in json.load(r)["data"]}
          except Exception as exc:
              print(f"/models недоступен ({type(exc).__name__} {getattr(exc, 'code', '')}): ротация по всем моделям",
                    file=sys.stderr)
              sys.exit(0)
          missing = [m for m in wanted if m not in have]
          print(f"нет у Groq: {missing or 'все есть'}", file=sys.stderr)
          print(f"есть у Groq: {sorted(have)}", file=sys.stderr)
          print("AGENOMICS_MODELS=" + ",".join(m for m in wanted if m in have))
          PY

      # Код выхода 1, если упал фреймворк с CI_TIER = "required" (см.
      # run_all_frameworks.py). experimental-фреймворки видны в отчёте,
      # но job не валят. [Unreleased] Два прохода: natural и стресс-сценарий
      # по номеру запуска (conditions.py); падения в стрессе job не валят.
      - name: Run all frameworks
        run: python run_all_frameworks.py
        env:
          # С v0.9.5 все шаблоны работают через Groq: другие ключи не нужны.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Validation Engine (v0.9.1): предсказывает ли замороженный Trust Score
      # исходы. Отчёт, а не проверка: insufficient_data на ранних данных
      # нормален, поэтому шаг job не валит.
      - name: Validation report
        if: always()
        continue-on-error: true
        run: agenomics validate frameworks_evidence.db

      # v0.9.6: полный отчёт по когорте текущей версии (артефакт) и
      # прогресс накопления. Вердикт и уровень утверждений job не валят.
      - name: Cohort report and accumulation scorecard
        if: always()
        continue-on-error: true
        env:
          CURRENT_REGIME_SINCE: "2026-10-09T14:18:00+00:00"
        run: |
          VERSION=$(python -c "import agenomics; print(agenomics.__version__)")
          agenomics validate frameworks_evidence.db --trust-model-version "$VERSION" --report validation_report.md
          # [Unreleased] Только текущий режим сбора: ротация по доступным моделям
          # с запуска 126 (2026-10-09T14:18Z). До него одна задача на шаблон, и
          # holdout по времени сравнивал бы исходы разных условий.
          echo "::group::natural с запуска 126"
          agenomics validate frameworks_evidence.db --trust-model-version "$VERSION" \
            --since "$CURRENT_REGIME_SINCE" --report validation_report_natural_current.md
          echo "::endgroup::"
          # [Unreleased] Каждая стресс-когорта отдельно: смешивать когорты нельзя.
          for COHORT in stress_runtime stress_security stress_task; do
            echo "::group::$COHORT"
            agenomics validate frameworks_evidence.db --trust-model-version "$VERSION" --cohort-type "$COHORT" \
              --report "validation_report_$COHORT.md"
            echo "::endgroup::"
          done
          agenomics scorecard frameworks_evidence.db --trust-model-version "$VERSION" --cohort-type all

      # run_attempt в ключе: при ручном Re-run run_id тот же, ключ первой
      # попытки уже занят, и сохранение второй падало с "Unable to reserve
      # cache" (прогон 36091548267, attempt 2). Следующий прогон тогда
      # восстанавливал базу первой попытки, и наблюдения второй терялись
      # из истории. restore-keys по префиксу по-прежнему берёт самый новый.
      - name: Save evidence database for the next run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: examples/framework_evaluation/frameworks_evidence.db
          key: frameworks-evidence-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload evidence database as downloadable artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frameworks-evidence-db-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            examples/framework_evaluation/frameworks_evidence.db
            examples/framework_evaluation/validation_report*.md
          retention-days: 90
