meta:
  environment: python
  toolchain:
    name: pip
    version: "3.11"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  scriptName: null
  command: uvicorn agenomics.api:app --host 0.0.0.0 --port 8000
  persistenceMount: /data
  containerPort: 8000
  
# Веб-API (agenomics/api.py) реализован и деплоится этой командой:
# POST /score, POST /compatibility, GET /health, GET /. Актуальные
# версии API и пакета синхронизированы, см. GET /health -> "version".
# Проверьте актуальный формат amvera.yml в документации Amvera перед
# деплоем на случай изменений синтаксиса платформы.
